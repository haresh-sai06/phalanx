<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phalanx — Configure Audit</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: radial-gradient(ellipse at top, #142752 0%, #050D22 60%);
  }
  .setup-card {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }
  .setup-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
  .setup-header .logo {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 100%);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: var(--bg);
  }
  .setup-header h1 { font-size: 24px; margin: 0; }
  .setup-header .subtitle { color: var(--text-dim); font-size: 13px; }

  .section { margin-bottom: 28px; }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--cyan);
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::before {
    content: '';
    display: inline-block;
    width: 12px;
    height: 2px;
    background: var(--cyan);
  }

  .input-group { margin-bottom: 14px; }
  .input-group label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type="text"], input[type="url"], select {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.15);
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-deep);
    padding: 4px;
    border-radius: 8px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 8px 14px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 5px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .tab.active {
    background: var(--cyan);
    color: var(--bg);
    font-weight: 600;
  }
  .tab:not(.active):hover { color: var(--text); }

  .model-row {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 12px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .model-row:last-child { border-bottom: none; }
  .model-role { font-size: 13px; color: var(--text-muted); font-weight: 500; }

  .slider-row { display: flex; align-items: center; gap: 16px; }
  input[type="range"] { flex: 1; accent-color: var(--cyan); }
  .slider-value {
    background: var(--cyan);
    color: var(--bg);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 13px;
    min-width: 44px;
    text-align: center;
  }

  .categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .cat-check {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .cat-check.checked { border-color: var(--cyan); color: var(--cyan); background: rgba(79, 195, 247, 0.08); }
  .cat-check input { accent-color: var(--cyan); }

  .cta-row {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .cost-estimate {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 10px;
  }
  .cost-estimate .num { color: var(--green); font-weight: 700; }
</style>
</head>
<body>
<div class="setup-card">

  <div class="setup-header">
    <div class="logo">Φ</div>
    <div>
      <h1>Configure new audit</h1>
      <div class="subtitle">Point Phalanx at your app. Zero configuration required.</div>
    </div>
  </div>

  <!-- Section 1: Target -->
  <div class="section">
    <div class="section-label">Target</div>
    <div class="input-group">
      <label for="repo">Repository URL</label>
      <input type="url" id="repo" value="github.com/haresh-sai06/buggystore" placeholder="github.com/...">
    </div>
    <div class="input-group">
      <label for="app">Running app URL</label>
      <input type="url" id="app" value="http://localhost:3000" placeholder="https://staging.your-app.com">
    </div>
  </div>

  <!-- Section 2: Model configuration -->
  <div class="section">
    <div class="section-label">Model configuration (BYOM)</div>

    <div class="tabs">
      <div class="tab" data-tier="cloud">Cloud</div>
      <div class="tab" data-tier="hybrid">Hybrid</div>
      <div class="tab active" data-tier="onprem">On-Prem</div>
    </div>

    <div class="model-row">
      <div class="model-role">Orchestrator</div>
      <select>
        <option>Qwen 3 32B (local · NVFP4)</option>
        <option>Claude Sonnet 4.5</option>
        <option>Gemini 3 Pro</option>
        <option>Llama 3.3 70B (Groq)</option>
      </select>
    </div>
    <div class="model-row">
      <div class="model-role">Persona actors</div>
      <select>
        <option>Qwen 2.5 7B (local · Ollama)</option>
        <option>Claude Haiku 4.5</option>
        <option>Gemini 2.5 Flash</option>
        <option>GPT-5 mini</option>
      </select>
    </div>
    <div class="model-row">
      <div class="model-role">Vision</div>
      <select>
        <option>Qwen-VL 7B (local)</option>
        <option>Gemini 2.5 Flash Vision</option>
        <option>Off</option>
      </select>
    </div>
  </div>

  <!-- Section 3: Audit scope -->
  <div class="section">
    <div class="section-label">Audit scope</div>

    <div class="input-group">
      <label>Max personas</label>
      <div class="slider-row">
        <input type="range" min="2" max="10" value="4" id="personas">
        <span class="slider-value" id="personas-val">4</span>
      </div>
    </div>

    <div class="input-group">
      <label>Bug categories to detect</label>
      <div class="categories">
        <label class="cat-check checked"><input type="checkbox" checked> Functional</label>
        <label class="cat-check checked"><input type="checkbox" checked> Security</label>
        <label class="cat-check checked"><input type="checkbox" checked> UX</label>
        <label class="cat-check"><input type="checkbox"> Performance</label>
      </div>
    </div>
  </div>

  <div class="cta-row">
    <a href="dashboard.html" class="btn btn-primary btn-block">Start Audit →</a>
    <div class="cost-estimate">
      Estimated cost: <span class="num">₹0</span> (on-prem, local models) · Estimated time: <span class="num">4 min</span>
    </div>
  </div>

</div>

<script>
  // Persona slider
  const slider = document.getElementById('personas');
  const val = document.getElementById('personas-val');
  slider.oninput = () => val.textContent = slider.value;

  // Tab switcher
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
    };
  });

  // Category checkboxes visual state
  document.querySelectorAll('.cat-check').forEach(c => {
    const cb = c.querySelector('input');
    cb.onchange = () => c.classList.toggle('checked', cb.checked);
  });
</script>
</body>
</html>

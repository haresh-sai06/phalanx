name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Unit + demo-app tests
        run: pytest -q tests/test_detectors.py tests/test_demo_app.py
      - name: Heuristic benchmark (planted bugs)
        run: pytest -q tests/test_benchmark_smoke.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phalanx"
version = "0.1.0"
description = "Multi-persona QA & security testing swarm (LangGraph + Playwright)"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "playwright>=1.40",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "openai>=1.40",
]

[project.scripts]
phalanx = "phalanx.cli:main"

[tool.setuptools.packages.find]
include = ["phalanx*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
